<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Знак для адаптивного значка — только он, без подложки.

       Масштаб подобран по безопасной зоне: система обрезает значок
       по своей форме (круг, квадрат, капля), и всё, что вылезло за круг
       поперечником 66% от значка, пропадёт. При единице круг занимает
       83% безопасной зоны — край виден целиком на любой маске и при
       этом знак не выглядит потерянным посреди плитки. Число проверяется
       в tools/icon.mjs по пикселям: на глаз этого не видно. -->
  <g transform="translate(256 256) scale(1) translate(-256 -256)">
    <circle cx="256" cy="256" r="126" fill="none" stroke="#FFFFFF" stroke-width="30" opacity=".38"/>
    <path d="M186 262l52 52 96-116"
          fill="none" stroke="#FFFFFF" stroke-width="42"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
