# Сборка APK.

# Собирает GitHub, а не эта машина, и это не удобство, а условие.
# У пользователя интернет 25–35 КБ/с: JDK и Android SDK весят около гигабайта,
# и качать их было бы вечером, а то и ночью. Здесь же скачивается только
# готовый APK — мегабайт десять.

name: APK

on:
  push:
    branches: [main]
    # Собираем не на каждый коммит: правка плана или стенда к приложению
    # отношения не имеет, а сборка идёт минуты.
    paths:
      - 'index.html'
      - 'app.js'
      - 'db.js'
      - 'styles.css'
      - 'manifest.json'
      - 'icons/**'
      - 'fonts/**'
      - 'src/**'
      - 'android-res/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'tools/www.mjs'
      - 'tools/icon.mjs'
      - 'tools/icon.html'
      - 'tools/chime.mjs'
      - 'tools/android.mjs'
      - 'tools/cdp.mjs'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    # Право положить сборку в релизы. Без этой строки шаг выкладки
    # упрётся в запрет — по умолчанию у сборочной машины прав на запись нет.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Java 21 — то, что требует Gradle из состава Capacitor 8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Отдельный шаг установки Android SDK здесь не нужен: на сборочных
      # машинах GitHub он уже стоит, и первая попытка упала ровно на нём —
      # мы ставили поверх уже установленного. Проверяем, что он на месте,
      # и идём дальше: если однажды его уберут из образа, это будет видно
      # сразу и с внятной причиной, а не сорока строками чужой ошибки.
      - name: Проверить Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Зависимости
        run: npm install --no-audit --no-fund

      - name: Собрать www/
        run: npm run www

      # Единственный кусок приложения, которому нужен сборщик.
      #
      # В браузере приложение обходится без единой зависимости: файлы
      # лежат рядом и подключаются как есть, потому что скачивать
      # библиотеки нам нечем. Но плагины Capacitor — обычные пакеты npm,
      # и в таком виде их в страницу не вставить. Поэтому src/native.js
      # складывается в один файл здесь, на быстрой машине, а в www/
      # уезжает уже готовым.
      #
      # Порядок важен: npm run www стирает папку целиком, значит сборка
      # слоя для телефона идёт строго после неё.
      - name: Собрать слой для телефона
        run: |
          npx esbuild src/native.js --bundle --format=esm --target=es2019 \
            --minify --legal-comments=none --outfile=www/native.js
          # Пустой файл тут — не «нет напоминаний», а сломанная сборка:
          # приложение его подгружает и молча остаётся без будильников.
          test -s www/native.js
          ls -lh www/native.js

      # android/ не хранится в репозитории: это сотни сгенерированных файлов,
      # которые ничего не значат и устаревают молча. Собираем на месте —
      # дольше на минуту, зато всегда из свежего.
      - name: Создать проект Android
        run: npx cap add android

      # Шаблон Capacitor — это значок Capacitor и ни одного разрешения
      # сверх интернета. Значки рисуются нашим логотипом, звук пишется
      # из двух синусоид, разрешения дописываются в манифест. Всё вместе
      # в одном шаге: это делается только вместе и только здесь.
      - name: Значки, звук и разрешения
        run: node tools/android.mjs android

      - name: Разложить приложение и плагины
        run: npx cap sync android

      - name: Собрать APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Что на самом деле оказалось в манифесте собранного приложения.

      # Проверка не для порядка. Разрешения дописывает наш скрипт, и почти
      # каждое — условие, без которого что-то молча не работает: без
      # MODIFY_AUDIO_SETTINGS не пишется голос, без USE_EXACT_ALARM
      # будильник приходит «около того». Снаружи и то и другое выглядит
      # как сломанный код, а искать приходится на телефоне.
      - name: Что попало в манифест
        run: |
          # Самый крупный из собранных манифестов — он и есть слитый:
          # в нём наши строки вместе с теми, что принесли плагины.
          merged=$(find android/app/build -name AndroidManifest.xml -printf '%s %p\n' \
                   | sort -rn | head -1 | cut -d' ' -f2-)
          echo "слитый манифест: $merged"
          grep -o 'android:name="android.permission[^"]*"' "$merged" | sort -u

          for p in RECORD_AUDIO MODIFY_AUDIO_SETTINGS POST_NOTIFICATIONS USE_EXACT_ALARM; do
            grep -q "android.permission.$p" "$merged" \
              || { echo "::error::в манифесте нет разрешения $p"; exit 1; }
          done

          # Приёмник виджета. Если его не окажется в слитом манифесте,
          # виджет не появится в списке у рабочего стола — и понять,
          # почему, можно будет только перебором.
          grep -q "DomovoyWidget" "$merged" \
            || { echo "::error::в манифесте нет приёмника виджета"; exit 1; }
          echo "приёмник виджета на месте"

      - name: Переименовать
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/domovoy-${GITHUB_SHA::7}.apk"
          # Имя для ссылки с телефона — постоянное. Иначе адрес менялся бы
          # на каждой сборке, а его придётся набирать руками.
          cp android/app/build/outputs/apk/debug/app-debug.apk out/domovoy.apk
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: domovoy-apk
          path: out/*.apk
          retention-days: 30

      # Отдельно — релиз со свежей сборкой.
      #
      # Файлы из «артефактов» GitHub отдаёт только вошедшим в аккаунт,
      # а на телефоне в него никто входить не станет. Релизы же скачиваются
      # кем угодно, и адрес у них постоянный:
      #   https://github.com/YuriyRS/napominalka/releases/download/apk/domovoy.apk
      # Именно эту ссылку и надо открывать на телефоне.
      #
      # Релиз один и тот же: старый сносим, новый кладём на его место.
      # Иначе их накопились бы сотни, и качать всегда пришлось бы искать.
      - name: Выложить ссылку для телефона
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Прежнюю сборку не выбрасываем, а откладываем в запасной релиз.
          #
          # Она и есть та, о которой известно, что работает: свежую человек
          # ещё не пробовал. Если новая окажется хуже, вернуться можно
          # сразу — не дожидаясь, пока я пересоберу старый коммит.
          #
          # Хранится ровно одна прежняя: десяток сборок по четыре мегабайта
          # ничего не добавят к выбору, а разбираться в них придётся дольше.
          if gh release view apk >/dev/null 2>&1; then
            mkdir -p prev
            gh release download apk -p domovoy.apk -D prev --clobber
            gh release delete apk-prev --yes --cleanup-tag 2>/dev/null || true
            gh release create apk-prev prev/domovoy.apk \
              --title "Домовой — прежняя сборка" \
              --notes "Сборка, которая была до нынешней. Ставится поверх,
          задачи сохраняются.

          https://github.com/YuriyRS/napominalka/releases/download/apk-prev/domovoy.apk"
          fi

          gh release delete apk --yes --cleanup-tag 2>/dev/null || true
          gh release create apk out/domovoy.apk \
            --title "Домовой — свежая сборка" \
            --notes "Собрано из коммита ${GITHUB_SHA::7}.

          Это отладочная сборка: она не подписана для магазина, Android
          спросит разрешение на установку из неизвестного источника.
          Ставится поверх прежней — задачи при этом сохраняются.

          Что уже есть: дела, календарь на месяц и год, подписки,
          голосовые заметки, копия и восстановление, темы.
          Напоминания — при первом запуске Android спросит разрешение
          на уведомления; их можно выключить в настройках приложения."
