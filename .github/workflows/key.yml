# Ключ подписи приложения.
#
# Запускается руками: Actions → «Ключ подписи» → Run workflow.
#
# Ключ — это не файл настроек, а документ. Им приложение подписывается,
# и по нему магазин отличает настоящую сборку от подделки. Потерять его
# значит потерять возможность выпускать обновления: приложение с другой
# подписью система не поставит поверх прежнего. Поэтому он делается
# один раз, хранится в тайне и лежит в двух местах.
#
# Здесь он только создаётся. Дальше его надо скачать из артефактов
# и завести в секретах репозитория — как именно, написано в конце
# в отчёте сборки.

name: Ключ подписи

on:
  workflow_dispatch:

jobs:
  key:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Пароль придумывает машина, а не человек: придуманный человеком
      # рано или поздно окажется словом из словаря, а этот ключ будет
      # лежать в магазине десятилетиями.
      - name: Создать ключ
        run: |
          set -e
          PASSWORD="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)"
          ALIAS=domovoy

          keytool -genkeypair \
            -keystore domovoy.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=Domovoy, O=Domovoy, C=RU"

          base64 -w0 domovoy.jks > keystore.b64

          SHA="$(keytool -list -v -keystore domovoy.jks -storepass "$PASSWORD" \
                 | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')"

          cat > ПРОЧТИ-МЕНЯ.txt <<TXT
          Ключ подписи приложения «Домовой».

          Файл ключа:      domovoy.jks
          Он же строкой:   keystore.b64  (эту строку вставлять в секрет)

          Пароль хранилища: $PASSWORD
          Пароль ключа:     $PASSWORD   (тот же самый)
          Имя ключа:        $ALIAS

          Отпечаток SHA-256: $SHA

          ЧТО С ЭТИМ ДЕЛАТЬ
          1. Сохраните оба файла в надёжном месте — не только на этом
             компьютере. Потеря ключа означает, что обновления выпустить
             больше нельзя: приложение с другой подписью система
             не поставит поверх прежнего.
          2. Заведите секреты в настройках репозитория:
             Settings → Secrets and variables → Actions → New repository
             secret. Нужны четыре:
               DOMOVOY_KEYSTORE          — содержимое файла keystore.b64
               DOMOVOY_STORE_PASSWORD    — пароль хранилища
               DOMOVOY_KEY_ALIAS         — имя ключа
               DOMOVOY_KEY_PASSWORD      — пароль ключа
          3. После этого обычная сборка начнёт делать ещё и релизную
             версию, подписанную этим ключом, — именно её принимает RuStore.

          Никому этот файл не показывайте: пароль рядом с ключом делает
          ключ бесполезным.
          TXT

          # Пароль печатаем в отчёт: он нужен человеку, а лог этой
          # сборки виден только владельцу репозитория. Секретом он
          # станет после того, как его туда заведут.
          {
            echo "## Ключ подписи создан"
            echo
            echo '```'
            cat ПРОЧТИ-МЕНЯ.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: domovoy-key
          path: |
            domovoy.jks
            keystore.b64
            ПРОЧТИ-МЕНЯ.txt
          retention-days: 7
