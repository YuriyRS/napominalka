<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Напоминалка</title>

<!-- цвет обновляется из app.js: если тема выбрана руками, системная
     настройка уже не подскажет браузеру, каким рисовать статус-бар -->
<meta name="theme-color" id="theme-color" content="#F4F2EE">
<meta name="description" content="Семейная напоминалка. Всё, что нужно не забыть.">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<!-- iOS сам скругляет значок, поэтому берём квадратный: у скруглённого
     по краям остались бы прозрачные подковки -->
<link rel="apple-touch-icon" href="icons/maskable-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Напоминалка">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <main class="screen" id="screen"></main>
</div>

<nav class="nav" id="nav" aria-label="Разделы"></nav>

<!-- затемнение одно на все листы: открыт всегда ровно один -->
<div class="sheet-back" id="sheet-back"></div>

<!-- лист: новое дело -->
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet__grip"></div>
  <h2 class="sheet__title" id="sheet-title">Новое дело</h2>

  <form id="task-form" autocomplete="off">
    <div class="field">
      <label class="field__label" for="f-title">Что нужно сделать</label>
      <input class="field__input" id="f-title" name="title" type="text"
             placeholder="Купить сыр галанский" required maxlength="120">
    </div>

    <div class="field">
      <label class="field__label" for="f-note">Заметка <span>— не обязательно</span></label>
      <input class="field__input" id="f-note" name="note" type="text"
             placeholder="в Пятёрочке у дома" maxlength="160">
    </div>

    <div class="field">
      <label class="field__label" for="f-time">Во сколько</label>
      <input class="field__input" id="f-time" name="time" type="time" required>
    </div>

    <div class="sheet__actions">
      <button class="btn btn--ghost" type="button" id="sheet-cancel">Отмена</button>
      <button class="btn btn--primary" type="submit">Добавить</button>
    </div>
  </form>
</section>

<!-- лист: настройки -->
<section class="sheet" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="sheet__grip"></div>
  <h2 class="sheet__title" id="settings-title">Настройки</h2>

  <div class="opt opt--stack">
    <div>
      <div class="opt__name">Оформление</div>
      <div class="opt__hint">Как в телефоне, светлое или тёмное</div>
    </div>
    <div class="seg" role="group" aria-label="Оформление">
      <button type="button" data-theme-set="auto"  aria-pressed="true">Авто</button>
      <button type="button" data-theme-set="light" aria-pressed="false">Светлая</button>
      <button type="button" data-theme-set="dark"  aria-pressed="false">Тёмная</button>
    </div>
  </div>

  <div class="opt opt--stack">
    <div>
      <div class="opt__name">Цвет</div>
      <div class="opt__hint">Кнопки, кольцо и выделения</div>
    </div>
    <div class="swatches" role="group" aria-label="Цвет акцента">
      <button type="button" data-accent-set="violet"  style="--sw:#5A28E0" aria-label="Фиолетовый"   aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button>
      <button type="button" data-accent-set="blue"    style="--sw:#1E40AF" aria-label="Синий"        aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button>
      <button type="button" data-accent-set="teal"    style="--sw:#0F6B66" aria-label="Петроль"      aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button>
      <button type="button" data-accent-set="emerald" style="--sw:#0B6B4F" aria-label="Изумрудный"   aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button>
    </div>
  </div>

  <div class="opt">
    <div>
      <div class="opt__name">Сохранить копию</div>
      <div class="opt__hint">Файл со всеми задачами. На случай, если телефон потеряется</div>
    </div>
    <button class="btn btn--ghost btn--mini" type="button" data-act="export">Сохранить</button>
  </div>

  <div class="opt">
    <div>
      <div class="opt__name">Загрузить копию</div>
      <div class="opt__hint">Заменит текущие задачи тем, что в файле</div>
    </div>
    <button class="btn btn--ghost btn--mini" type="button" data-act="import">Загрузить</button>
  </div>

  <div class="sheet__actions">
    <button class="btn btn--primary" type="button" data-act="close">Готово</button>
  </div>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
</section>

<!-- лист: что сделать с делом. Открывается долгим нажатием -->
<section class="sheet" id="task-sheet" role="dialog" aria-modal="true" aria-labelledby="task-sheet-title">
  <div class="sheet__grip"></div>
  <h2 class="sheet__title sheet__title--task" id="task-sheet-title"></h2>

  <div class="acts">
    <button class="act" type="button" data-act="edit">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 20h4.2L19.1 9.1a2.7 2.7 0 0 0-3.8-3.8L4.4 16.2V20z"/><path d="M14.6 6.1l3.3 3.3"/>
      </svg>Изменить
    </button>
    <button class="act" type="button" data-act="move">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 12h15"/><path d="M13.5 6.5L19 12l-5.5 5.5"/>
      </svg><span id="move-label">Перенести на завтра</span>
    </button>
    <button class="act act--danger" type="button" data-act="delete">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6.5h16"/>
        <path d="M9.5 6.5V4.8A1.3 1.3 0 0 1 10.8 3.5h2.4a1.3 1.3 0 0 1 1.3 1.3v1.7"/>
        <path d="M6.6 6.5l.85 12.4a1.6 1.6 0 0 0 1.6 1.6h5.9a1.6 1.6 0 0 0 1.6-1.6l.85-12.4"/>
      </svg>Удалить
    </button>
  </div>
</section>

<!-- полоска «удалено, можно вернуть» -->
<div class="undo" id="undo" role="status" aria-live="polite">
  <div class="undo__body">
    <span>Дело удалено</span>
    <button class="undo__back" type="button" data-act="undo">Вернуть</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
